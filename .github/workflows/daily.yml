name: Daily predictions

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC = 06:00 Nigerian time
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install numpy pandas scipy
      - name: Build predictions
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python daily_run.py
      - name: Save results to the repo
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add predictions.json
          if [ -f predictions_log.csv ]; then git add predictions_log.csv; fi
          git diff --staged --quiet || git commit -m "Daily predictions"
          git push
