<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football AI Pro</title>
    <style>
        :root {
            --bg: #0b1120; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
            --accent: #3b82f6; --success: #10b981; --danger: #ef4444; --border: #334155;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 50px; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.6rem; margin: 0; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .header p { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
        
        .match-card { background: var(--card); border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); overflow: hidden; transition: all 0.3s ease; }
        .match-header { padding: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .match-header:active { background: #2a3a55; }
        .match-info h3 { margin: 0; font-size: 1.1rem; }
        .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .best-bet-badge { background: rgba(16, 185, 129, 0.15); color: var(--success); padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-align: right; }
        .best-bet-badge span { display: block; font-size: 0.9rem; }
        
        .details { display: none; padding: 16px; border-top: 1px solid var(--border); background: #0f172a; }
        .match-card.expanded .details { display: block; }
        .match-card.expanded .match-header { border-bottom: 1px solid var(--border); }
        
        .xg-box { display: flex; justify-content: space-between; background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 16px; text-align: center; font-size: 0.85rem; }
        .xg-box div { flex: 1; }
        .xg-val { font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        .section-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin: 16px 0 8px 0; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .market-item { background: var(--card); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; }
        .market-name { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
        .market-prob { font-size: 1rem; font-weight: bold; color: var(--text); margin-bottom: 8px; }
        .market-prob.high { color: var(--success); }
        .odds-input { display: flex; align-items: center; gap: 4px; }
        input[type="number"] { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid var(--border); background: #0f172a; color: white; font-size: 0.85rem; }
        .val-badge { font-size: 0.65rem; padding: 4px; border-radius: 4px; font-weight: bold; text-align: center; margin-top: 4px; display: none; }
        .val-badge.show { display: block; }
        .val-good { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .val-bad { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .loading { text-align: center; color: var(--muted); margin-top: 50px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Football AI Pro</h1>
        <p id="update-time">Loading database...</p>
    </div>
    <div id="app"><div class="loading">Fetching all leagues...</div></div>

    <script>
        fetch('predictions.json').then(r => r.json()).then(data => {
            const app = document.getElementById('app');
            document.getElementById('update-time').innerText = `Updated: ${data.generated.replace('T', ' ')}`;
            
            if (!data.matches || data.matches.length === 0) {
                app.innerHTML = '<div class="loading">No matches available.</div>';
                return;
            }

            app.innerHTML = '';
            
            data.matches.forEach((match, index) => {
                // Find the best bet for the summary card
                let bestProb = 0;
                let bestBetName = "";
                const teamGoals = match.markets["Team Goals"] || {};
                const totalGoals = match.markets["Total Goals"] || {};
                
                Object.entries({...teamGoals, ...totalGoals}).forEach(([k, v]) => {
                    if (v > bestProb) { bestProb = v; bestBetName = k; }
                });

                const card = document.createElement('div');
                card.className = 'match-card';
                
                let detailsHTML = `
                    <div class="xg-box">
                        <div><div>${match.home} xG</div><div class="xg-val">${match.xg_home}</div></div>
                        <div><div>${match.away} xG</div><div class="xg-val">${match.xg_away}</div></div>
                    </div>
                `;

                // Helper to build market grids
                const buildGrid = (marketsObj, title) => {
                    if (!marketsObj) return '';
                    let html = `<div class="section-title">${title}</div><div class="market-grid">`;
                    for (const [name, prob] of Object.entries(marketsObj)) {
                        const probPct = (prob * 100).toFixed(1);
                        const probClass = prob >= 0.80 ? 'high' : '';
                        html += `
                            <div class="market-item">
                                <div class="market-name">${name}</div>
                                <div class="market-prob ${probClass}">${probPct}%</div>
                                <div class="odds-input">
                                    <input type="number" step="0.01" placeholder="Odds" oninput="checkValue(this, ${prob})">
                                </div>
                                <div class="val-badge">-</div>
                            </div>
                        `;
                    }
                    return html + '</div>';
                };

                detailsHTML += buildGrid(match.markets["Team Goals"], "Team Goals");
                detailsHTML += buildGrid(match.markets["Total Goals"], "Total Goals");
                detailsHTML += buildGrid(match.markets["Result"], "Match Result");
                detailsHTML += buildGrid(match.markets["BTTS"], "Both Teams to Score");
                detailsHTML += buildGrid(match.markets["Correct Score"], "Top Correct Scores");

                card.innerHTML = `
                    <div class="match-header" onclick="this.parentElement.classList.toggle('expanded')">
                        <div class="match-info">
                            <div class="meta">${match.league} &bull; ${match.date} ${match.time}</div>
                            <h3>${match.home} vs ${match.away}</h3>
                        </div>
                        <div class="best-bet-badge">
                            Top Option
                            <span>${bestBetName.replace(match.home, 'H').replace(match.away, 'A')}</span>
                            ${(bestProb * 100).toFixed(0)}%
                        </div>
                    </div>
                    <div class="details">
                        ${detailsHTML}
                    </div>
                `;
                app.appendChild(card);
            });
        }).catch(e => {
            document.getElementById('app').innerHTML = '<div class="loading">⚠️ Error loading database.</div>';
        });

        function checkValue(input, prob) {
            const odds = parseFloat(input.value);
            const badge = input.parentElement.nextElementSibling;
            if (odds > 1.01) {
                const implied = 1 / odds;
                if (prob > implied) {
                    badge.innerText = `VALUE +${((prob - implied) * 100).toFixed(1)}%`;
                    badge.className = 'val-badge show val-good';
                } else {
                    badge.innerText = `NO VALUE`;
                    badge.className = 'val-badge show val-bad';
                }
            } else {
                badge.className = 'val-badge';
            }
        }
    </script>
</body>
</html>
