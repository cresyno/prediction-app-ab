<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Football AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column like a matchday feed. Match cards in a list, one match per screen on tap.
   Ink-and-paper neutrals tinted toward pitch green. Blue = home, orange = away, grey = draw. Data is the only loud colour. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EDE8; --ink:#14211B; --ink-2:#53655B; --line:#D5DDD6;
  --home:#257DE0; --draw:#9AA59F; --away:#F47230;
  --good:#006C10; --good-bg:#DCF0E1; --warn:#6F4700; --warn-bg:#FBEBC8;
  --focus:#1757AC;
  --font-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1612; --surface:#14211C; --surface-2:#1C2E27; --ink:#EAF1EC; --ink-2:#9DB2A6; --line:#26392F;
    --home:#338CED; --draw:#6F8077; --away:#E76624;
    --good:#53C556; --good-bg:#16301D; --warn:#F0C36B; --warn-bg:#3A2E10;
    --focus:#84B9F3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#14211C; --surface-2:#1C2E27; --ink:#EAF1EC; --ink-2:#9DB2A6; --line:#26392F;
  --home:#338CED; --draw:#6F8077; --away:#E76624;
  --good:#53C556; --good-bg:#16301D; --warn:#F0C36B; --warn-bg:#3A2E10;
  --focus:#84B9F3; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-ui);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{max-width:680px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .page{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px}
.brand{display:flex;align-items:center;gap:8px;font:700 23px/1 var(--font-num);letter-spacing:.01em;text-decoration:none}
.brand svg{flex:none}
.nav{display:flex;gap:2px}
.nav button{min-height:44px;padding:0 9px;background:none;border:0;border-radius:10px;font-weight:500;color:var(--ink-2);cursor:pointer}
.nav button[aria-pressed="true"]{color:var(--ink);background:var(--surface-2)}

/* status + filters */
.status{margin:14px 0 4px}
.line{margin:0;color:var(--ink-2);font-size:14px}
.banner{margin:10px 0 0;padding:11px 13px;border-radius:10px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.banner p{margin:0 0 8px}
.banner b{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin-top:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* match cards */
.day{margin:24px 0 8px;font:600 13px/1 var(--font-num);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.day b{color:var(--ink);font-weight:700}
.card{display:block;margin:0 0 10px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none}
.card:active{background:var(--surface-2)}
.meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0}
.tn{display:flex;align-items:center;gap:9px;min-width:0}
.tname{font:600 22px/1.15 var(--font-num);overflow-wrap:anywhere}
.tpct{font:600 30px/1 var(--font-num);flex:none}
.tpct small,.r-p small{font-size:.6em;font-weight:500;margin-left:1px;color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--draw)}
.dot.h{background:var(--home)} .dot.a{background:var(--away)}
.bar{display:flex;gap:2px;height:8px;margin:12px 0 8px}
.bar i{display:block;height:100%;min-width:3px;border-radius:4px;background:var(--draw)}
.bar i.h{background:var(--home)} .bar i.a{background:var(--away)}
.sub{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.sub .d{display:inline-flex;align-items:center;gap:6px}
.scores{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.scores b{color:var(--ink);font-weight:600}
.empty{padding:28px 0;color:var(--ink-2)}

/* panels */
.panel{margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.panel h2{margin:0 0 10px;font:700 22px/1.1 var(--font-num)}
.panel h3{margin:18px 0 6px;font:600 16px/1.2 var(--font-num);letter-spacing:.02em}
.panel p{margin:0 0 10px;color:var(--ink-2)}
.panel .acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.panel label.l{display:block;margin:14px 0 6px;font-weight:500}
.panel textarea,.panel input[type=url]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.panel textarea{min-height:92px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.msg{min-height:1.4em;margin:10px 0 0;font-weight:500}
.msg.err{color:var(--warn)}
.trust{list-style:none;margin:0;padding:0}
.trust li{padding:10px 0;border-top:1px solid var(--line)}
.trust li:first-child{border-top:0}
.trust .h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:2px}
.trust p{margin:0;font-size:14px}
.facts{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.facts li{margin:4px 0}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:6px;color:var(--ink-2);font-weight:500;text-decoration:none}
.kick{margin:2px 0 6px;font-size:14px;color:var(--ink-2)}
h1.dt{margin:0 0 8px;font:700 36px/1.05 var(--font-num)}
h1.dt .tn{display:flex;padding:2px 0}
h1.dt .dot{width:12px;height:12px}
.xg{margin:0 0 4px;color:var(--ink-2);font-size:14px}
.xg b{color:var(--ink);font-weight:600}
.howto{margin:12px 0 0;padding:11px 13px;border-radius:10px;background:var(--surface-2);font-size:14px;color:var(--ink-2)}
.howto b{color:var(--ink);font-weight:600}
.scoring{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0 4px}
@media (min-width:560px){.scoring{grid-template-columns:1fr 1fr}}
.tcard{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tcard h3{display:flex;align-items:center;gap:9px;margin:0 0 10px;font:600 18px/1.15 var(--font-num)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;align-items:end;height:92px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.cb{width:24px;border-radius:4px 4px 0 0;background:var(--draw);min-height:2px}
.col.top .cb{background:var(--home)}
.tcard.away .col.top .cb{background:var(--away)}
.axis{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;border-top:1px solid var(--line);padding-top:5px;text-align:center;font-size:13px;color:var(--ink-2)}
.axis b{display:block;color:var(--ink);font-weight:600;font-family:var(--font-num);font-size:15px}
.tcard p{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.tcard p b{color:var(--ink);font-weight:600}
.sec{margin:10px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.sec>summary{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 16px;cursor:pointer;list-style:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";width:8px;height:8px;margin-left:2px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg) translateY(-2px);flex:none}
.sec[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.s-title{flex:1;min-width:0;font:600 19px/1.15 var(--font-num);overflow-wrap:anywhere}
.badge{flex:none;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;background:var(--surface-2)}
.badge.best{color:var(--good);background:var(--good-bg)}
.badge.weak{color:var(--warn);background:var(--warn-bg)}
.badge.untested{background:none;border:1px solid var(--line);color:var(--ink-2)}
.s-note{margin:0;padding:0 16px 8px;font-size:13px;color:var(--ink-2)}
.rows{list-style:none;margin:0;padding:0 16px 6px}
.row{padding:12px 0;border-top:1px solid var(--line)}
.r-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.r-label{min-width:0;font-weight:500;overflow-wrap:anywhere}
.r-p{flex:none;font:600 24px/1 var(--font-num)}
.meter{height:4px;margin:8px 0 9px;border-radius:2px;background:var(--surface-2)}
.meter i{display:block;height:100%;border-radius:2px;background:var(--ink-2)}
.meter i.h{background:var(--home)} .meter i.a{background:var(--away)} .meter i.d{background:var(--draw)}
.r-bot{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.fair{font-size:14px;color:var(--ink-2)}
.fair b{color:var(--ink);font-weight:600}
.odds{width:104px;min-height:40px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.res{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.res.up{background:var(--warn-bg);color:var(--warn)}
.r-note{margin:7px 0 0;font-size:13px;color:var(--ink-2)}
.foot{margin:28px 0 34px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.foot p{margin:0 0 6px}

/* form, bet check, bets */
.form{margin:12px 0 0;padding:11px 13px;border-radius:10px;background:var(--surface-2);font-size:14px}
.form-h{margin:0 0 6px;font:600 13px/1 var(--font-num);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.frow{display:flex;flex-wrap:wrap;gap:2px 12px;padding:3px 0;color:var(--ink-2)}
.frow b{flex:1 0 100%;color:var(--ink);font-weight:600}
.hint{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.panel .hint{margin:8px 0}
.r-note b{color:var(--ink);font-weight:600}
.logbtn{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500;cursor:pointer}
.lf{margin:10px 0 0;padding:12px;border-radius:10px;background:var(--surface-2)}
.lf-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lf input.stake{width:104px;min-height:40px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;border:0;background:var(--bg);font-weight:500;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lw{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.stat{padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.stat span{display:block;font-size:13px;color:var(--ink-2)}
.stat b{font:700 22px/1.2 var(--font-num)}
.stat b.neg{color:var(--warn)} .stat b.pos{color:var(--good)}
.bet{padding:11px 0;border-top:1px solid var(--line)}
.bet .bt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.bet .bm{margin:2px 0 8px;font-size:13px;color:var(--ink-2)}
.bet .ba{display:flex;flex-wrap:wrap;gap:6px}
.bet .ba button{min-height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.tag{flex:none;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.tag.won{background:var(--good-bg);color:var(--good)} .tag.lost{background:var(--warn-bg);color:var(--warn)}
.cfg{display:grid;grid-template-columns:1fr;gap:10px}
.cfg label{display:block;font-weight:500;font-size:14px}
.cfg-i{display:block;width:100%;margin-top:4px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.panel ol.facts{margin:0}
.banner ul.facts{color:inherit}
.banner details{margin-top:4px}
.banner summary{cursor:pointer;font-weight:600;min-height:32px}
#csv{margin-top:10px;min-height:120px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="page">
    <a class="brand" href="#matches" aria-label="Football AI, all matches">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/><path d="M12 3.5v17" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>

      <button type="button" id="nav-about" data-act="about" aria-pressed="false">About</button>

  </div>
</header>
<main class="page" id="main">
  <div id="panel"></div>

  </footer>
</main>

    var xg = (isFinite(m.xgH) && isFinite(m.xgA)) ? '<p class="xg">Expected goals <b>' + m.xgH.toFixed(2) + '</b> – <b>' + m.xgA.toFixed(2) + '</b></p>' : '';
    var newModel = S.data.schema === 'new' ? ' This file comes from the newer model, which has not been backtested.' : '';
    $('#view').innerHTML = '<a class="back" href="#matches">← All matches</a>' +
      '<p class="kick">' + esc(m.league) + ' · ' + esc(dayLabel(m.date)) + (m.time ? ' · ' + esc(m.time) : '') + '</p>' +
      '<h1 class="dt"><span class="tn"><i class="dot h"></i>' + esc(m.home) + '</span><span class="tn"><i class="dot a"></i>' + esc(m.away) + '</span></h1>' + xg +
      '<p class="howto"><b>Fair odds</b> = 100 ÷ chance. Type SportyBet\'s odds into a row. The page shows the break-even rate, the edge, and whether it thinks the bet deserves any money. Most rows will say skip, and that is the honest answer most of the time.' + newModel + '</p>' +
      formHtml(m) + '<div class="scoring">' + teamCard(m, m.home, 'home') + teamCard(m, m.away, 'away') + '</div>' + secs;
    $('#panel').hidden = true;
    document.querySelectorAll('#view input.odds').forEach(function (inp) { if (inp.value) updateRow(inp, false); });
  }
  function currentMatch() { var mm = /^m-(\d+)$/.exec(location.hash.slice(1)); return mm && S.data && S.data.matches[+mm[1]]; }
  function updateRow(inp, save) {
    var row = inp.closest('.row'), res = row.querySelector('.res'), note = row.querySelector('.r-note'), btn = row.querySelector('.logbtn'), slot = row.querySelector('.lf-slot');
    var o = parseOdds(inp.value), p = +row.dataset.p, kind = row.dataset.kind, label = row.dataset.label;
    if (save) { var m = currentMatch(); if (m) saveOdd(m.key, inp.dataset.k, inp.value.trim()); }
    if (o === null) { res.hidden = true; note.hidden = true; btn.hidden = true; slot.innerHTML = ''; return; }
    var ev = p * o - 1, v = verdict(kind, label, p, o), be = 1 / o, wins = 1 / (o - 1);
    res.hidden = false; res.className = 'res' + (ev > 0 ? ' up' : ''); res.textContent = pctTxt(ev) + (ev > 0 ? ' model edge' : ' · no edge');
    var back = o >= 2 ? 'One win repays <b>' + fmtN(o - 1) + '</b> ' + (Math.abs(o - 2) < 0.05 ? 'loss' : 'losses') + '.'
      : 'After one loss it takes <b>' + fmtN(wins) + '</b> ' + (Math.abs(wins - 1) < 0.05 ? 'win' : 'wins') + ' to get back to even.';
    var html = 'Break-even: you must win <b>' + Math.round(be * 100) + '</b> of every 100. ' + back;
    if (ev > 0) html += ' Cautious edge ' + pctTxt(ev / 2) + ' (half the model edge, because bookmaker odds were sharper in testing). ' + esc(edgeNote(kind, label));
    html += ' <b>' + esc(v.text) + '</b>';
    if (v.code === 'test') {
      var s = suggestStake(p, o);
      html += s === null ? ' Set your bankroll in My bets for a stake guide.' : ' Stake guide: <b>' + money(s) + '</b> (a quarter of the cautious Kelly stake, capped at ' + cfgNum('maxpct', 2) + '% of your bankroll).';
    }
    note.innerHTML = html; note.hidden = false; btn.hidden = false;
  }

  /* ---------- logging a bet ---------- */
  function openLog(row) {
    var slot = row.querySelector('.lf-slot');
    if (slot.innerHTML) { slot.innerHTML = ''; return; }
    var o = parseOdds(row.querySelector('input.odds').value); if (o === null) return;
    var p = +row.dataset.p, v = verdict(row.dataset.kind, row.dataset.label, p, o), s = suggestStake(p, o);
    var def = (v.code === 'test' && s) ? String(Math.max(1, Math.round(s))) : '';
    slot.innerHTML = '<div class="lf"><div class="lf-row"><input class="stake" type="text" inputmode="decimal" autocomplete="off" placeholder="Stake ₦" aria-label="Stake in naira" value="' + def + '">' +
      '<div class="seg" role="group" aria-label="Bet type"><button type="button" data-act="mode" data-v="paper" aria-pressed="true">Paper</button><button type="button" data-act="mode" data-v="real" aria-pressed="false">Real</button></div>' +
      '<button type="button" class="btn primary" data-act="savebet">Log bet</button></div>' +
      '<p class="lw" role="status">Paper means no money: you only track whether the pick would have won.</p></div>';
  }
  function betWarnings(row, o, stake, mode) {
    var out = [];
    if (mode !== 'real') return out;
    var v = verdict(row.dataset.kind, row.dataset.label, +row.dataset.p, o), bank = num(S.cfg.bank), lim = num(S.cfg.daily);
    if (v.code !== 'test') out.push('The page sees no real-money case for this bet.');
    if (bank > 0) { var cap = bank * cfgNum('maxpct', 2) / 100; if (stake > cap + 0.005) out.push('That is above your max stake of ' + money(cap) + '.'); }
    if (lim > 0 && todayRealStake() + stake > lim) out.push('It takes today\'s real stakes over your daily limit of ' + money(lim) + '.');
    return out;
  }
  function saveBet(row) {
    var lf = row.querySelector('.lf'), warn = lf.querySelector('.lw'), o = parseOdds(row.querySelector('input.odds').value), stake = num(lf.querySelector('.stake').value);
    var mode = lf.querySelector('.seg [aria-pressed="true"]').dataset.v, m = currentMatch();
    if (!m || o === null) return;
    if (stake === null || stake <= 0) { warn.textContent = 'Enter a stake first.'; return; }
    var w = betWarnings(row, o, stake, mode), sig = w.join('|') + '#' + stake + '#' + mode;
    if (w.length && lf.dataset.ok !== sig) { lf.dataset.ok = sig; warn.textContent = w.join(' ') + ' Tap Log bet again to log it anyway.'; return; }
    var now = new Date();
    S.bets.push({ id: now.getTime().toString(36) + Math.random().toString(36).slice(2, 6), at: iso(now) + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
      date: m.date, league: m.league, match: m.home + ' v ' + m.away, market: row.dataset.sec + ': ' + row.dataset.label, odds: o, stake: stake, p: +row.dataset.p, mode: mode, st: 'open' });
    saveBets();
    row.querySelector('.lf-slot').innerHTML = '<p class="hint">Logged as ' + mode + ' bet: ' + money(stake) + ' at ' + o + '. Find it in My bets.</p>';
  }

  /* ---------- My bets ---------- */
  function betStats(list) {
    var settled = list.filter(function (b) { return b.st === 'won' || b.st === 'lost'; });
    var won = settled.filter(function (b) { return b.st === 'won'; }).length, staked = 0, ret = 0;
    settled.forEach(function (b) { staked += b.stake; if (b.st === 'won') ret += b.stake * b.odds; });
    var n = settled.length, avg = function (f) { return n ? settled.reduce(function (a, b) { return a + f(b); }, 0) / n : null; };
    return { n: n, won: won, staked: staked, ret: ret, profit: ret - staked, roi: staked > 0 ? (ret - staked) / staked : null,
      hit: n ? won / n : null, be: avg(function (b) { return 1 / b.odds; }), avgp: avg(function (b) { return b.p; }), open: list.filter(function (b) { return b.st === 'open'; }).length };
  }
  function csvText() {
    var q = function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; };
    var rows = [['logged', 'match_date', 'league', 'match', 'market', 'odds', 'stake', 'model_prob', 'mode', 'status'].join(',')];
    S.bets.forEach(function (b) { rows.push([b.at, b.date, q(b.league), q(b.match), q(b.market), b.odds, b.stake, b.p.toFixed(4), b.mode, b.st].join(',')); });
    return rows.join('\n');
  }
  function betsPanel() {
    var f = S.betF, list = S.bets.filter(function (b) { return f === 'all' || b.mode === f; }), st = betStats(list);
    var h = '<section class="panel" aria-labelledby="ph"><h2 id="ph">My bets</h2>' +
      '<p>Log a bet from any match page (type the odds, tap Log bet). Mark it won or lost afterwards. This is how you find out, with real numbers, whether the AI is worth any money.</p>' +
      '<div class="chips" role="group" aria-label="Show">' + [['all', 'All'], ['paper', 'Paper'], ['real', 'Real money']].map(function (x) {
        return '<button type="button" class="chip" data-f="betF" data-v="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>';
    var tile = function (l, v, cls) { return '<div class="stat"><span>' + l + '</span><b class="' + (cls || '') + '">' + v + '</b></div>'; };
    h += '<div class="stats">' +
      tile('Settled', st.n + (st.n ? ' (' + st.won + ' won)' : '')) +
      tile('Profit', st.n ? money(st.profit) : '–', st.n ? (st.profit < 0 ? 'neg' : st.profit > 0 ? 'pos' : '') : '') +
      tile('Won', st.hit === null ? '–' : Math.round(st.hit * 100) + '%') +
      tile('Needed to break even', st.be === null ? '–' : Math.round(st.be * 100) + '%') +
      tile('AI said (average)', st.avgp === null ? '–' : Math.round(st.avgp * 100) + '%') +
      tile('Return on stakes', st.roi === null ? '–' : pctTxt(st.roi), st.roi === null ? '' : (st.roi < 0 ? 'neg' : 'pos')) + '</div>';
    if (!st.n) h += '<p class="hint">Nothing settled yet.' + (st.open ? ' ' + st.open + ' bet' + (st.open === 1 ? ' is' : 's are') + ' still open.' : '') + '</p>';
    else if (st.n < 100) h += '<p class="hint">Only ' + st.n + ' settled bet' + (st.n === 1 ? '' : 's') + '. Below about 100, luck swamps skill, so do not read a trend yet. If "Won" stays under "Needed to break even", the AI is losing.</p>';
    else h += '<p class="hint">' + st.n + ' settled bets. If "Won" is above "Needed to break even" and profit is positive, the AI may have an edge. If not, it does not.</p>';
    var sorted = list.slice().reverse();
    h += '<h3>Bets</h3>';
    if (!sorted.length) h += '<p class="hint">No bets logged yet.</p>';
    sorted.forEach(function (b) {
      var tagTxt = { open: 'Open', won: 'Won', lost: 'Lost', void: 'Void' }[b.st] || b.st;
      var acts = b.st === 'open'
        ? '<button type="button" data-act="settle" data-id="' + b.id + '" data-v="won">Won</button><button type="button" data-act="settle" data-id="' + b.id + '" data-v="lost">Lost</button><button type="button" data-act="settle" data-id="' + b.id + '" data-v="void">Void</button>'
        : '<button type="button" data-act="settle" data-id="' + b.id + '" data-v="open">Undo</button>';
      h += '<div class="bet"><div class="bt"><span>' + esc(b.match) + '</span><span class="tag ' + b.st + '">' + tagTxt + '</span></div>' +
        '<div class="bm">' + esc(b.market) + ' · odds ' + b.odds + ' · ' + money(b.stake) + ' · ' + (b.mode === 'real' ? 'Real' : 'Paper') + ' · AI said ' + fmtPct(b.p) + '%</div>' +
        '<div class="ba">' + acts + '<button type="button" data-act="delbet" data-id="' + b.id + '">Delete</button></div></div>';
    });
    h += '<h3>Your limits</h3><p class="hint">Used for stake guides and warnings on real-money bets. Leave blank to switch off.</p><div class="cfg">' +
      '<label>Bankroll (₦)<input class="cfg-i" type="text" inputmode="decimal" data-cfg="bank" value="' + esc(S.cfg.bank || '') + '"></label>' +
      '<label>Max stake (% of bankroll)<input class="cfg-i" type="text" inputmode="decimal" data-cfg="maxpct" placeholder="2" value="' + esc(S.cfg.maxpct || '') + '"></label>' +
      '<label>Daily limit (₦ of real stakes)<input class="cfg-i" type="text" inputmode="decimal" data-cfg="daily" value="' + esc(S.cfg.daily || '') + '"></label></div>';
    var td = todayRealStake();
    if (td > 0) h += '<p class="hint">Real stakes logged today: ' + money(td) + '.</p>';
    h += '<div class="acts" style="margin-top:12px"><button type="button" class="btn" data-act="csv">' + (S.csv ? 'Hide text version' : 'Show as text (to copy)') + '</button>' +
      '<button type="button" class="btn" data-act="delall">' + (S.delAll ? 'Tap again to delete all bets' : 'Delete all bets') + '</button></div>';
    if (S.csv) h += '<textarea readonly id="csv" aria-label="Your bets as text" onfocus="this.select()">' + esc(csvText()) + '</textarea>';
    return h + '</section>';
  }

  /* ---------- panels ---------- */
  function renderPanel() {
    var el = $('#panel'), p = S.panel;
    $('#nav-data').setAttribute('aria-pressed', p === 'data'); $('#nav-about').setAttribute('aria-pressed', p === 'about'); $('#nav-bets').setAttribute('aria-pressed', p === 'bets');
    if (!p) { el.innerHTML = ''; return; }
    if (p === 'data') {
      el.innerHTML = '<section class="panel" aria-labelledby="ph"><h2 id="ph">Load predictions</h2>' +
        '<p>Run <b>daily_run.py</b>, then load the <b>predictions.json</b> it saves. The page remembers it on this phone.</p>' +
        '<div class="acts"><label class="btn primary" for="file">Choose predictions.json</label><input class="sr" id="file" type="file" accept=".json,application/json,text/plain"></div>' +
        '<label class="l" for="paste">Or paste the file contents</label><textarea id="paste" placeholder="{ &quot;generated&quot;: …, &quot;matches&quot;: [ … ] }"></textarea>' +
        '<div class="acts" style="margin-top:8px"><button type="button" class="btn" data-act="paste">Load pasted data</button></div>' +
        '<label class="l" for="url">Or load from a web address</label><input id="url" type="url" inputmode="url" placeholder="https://your-site.vercel.app/predictions.json" value="' + esc(lsGet('fai-url') || '') + '">' +
        '<div class="acts" style="margin-top:8px"><button type="button" class="btn" data-act="url">Load from address</button></div>' +
        '<div class="acts" style="margin-top:14px"><button type="button" class="btn" data-act="demo">Use demo data</button><button type="button" class="btn" data-act="forget">Forget saved data</button></div>' +
        '<p class="msg" id="panel-msg" role="status"></p></section>';
    } else if (p === 'bets') {
      el.innerHTML = betsPanel();
    } else {
      var order = ['team', 'result', 'dnb', 'dc', 'totals', 'btts', 'hcap', 'cs'];
      var nm = (S.data && S.data.schema === 'new') ? '<p class="banner"><b>Newer model.</b> Your file comes from the newer model (more leagues, shots-based). The results below are for the original model on the Premier League and La Liga. The newer one is untested, so treat it as untested until your own bets and predictions_log.csv say otherwise.</p>' : '';
      el.innerHTML = '<section class="panel" aria-labelledby="ph"><h2 id="ph">How far to trust this</h2>' + nm +
        '<p>The original model was replayed on 1,743 past matches from the Premier League and La Liga (the last three seasons, to November 2026). For each match it saw only earlier games.</p>' +
        '<ul class="trust">' + order.map(function (k) { var t = TRUST[k]; return '<li><div class="h">' + esc(t.name) + ' <span class="badge ' + t.lvl + '">' + t.badge + '</span></div><p>' + esc(t.note) + '</p></li>'; }).join('') + '</ul>' +
        '<h3>Against the bookmakers</h3><ul class="facts">' +
        '<li>Match result accuracy score: model 0.990, market 0.972 (lower is better). The market is sharper.</li>' +
        '<li>Over/under 2.5: model 0.682, market 0.671. The model gets about half of the market\'s edge over guessing.</li>' +
        '<li>Betting every match result blindly lost 7.0%. Picks where the model saw a 5%+ edge lost 15.6% (1,312 bets).</li>' +
        '<li>Over/under 2.5 picks with a 10%+ edge returned +2.7%, give or take 5.4. That is inconclusive.</li></ul>' +
        '<h3>What this means</h3><p>The page estimates chances. It has not shown that it beats bookmaker odds, so a "model edge" is more often the model\'s mistake than a bargain. Newly promoted teams and short histories are the weakest spots.</p>' +
        '<h3>Rules for playing</h3><ol class="facts">' +
        '<li><b>Paper first.</b> Log bets as paper until you have 100 settled bets and the profit is positive.</li>' +
        '<li><b>Check break-even.</b> At odds of 1.25 you must win 80 of every 100, and one loss takes four wins to repay. Short odds leave no room for error.</li>' +
        '<li><b>Real money only when the page says "Worth a small test stake".</b> That means: a team to score 1+, the model at 80% or more, and a cautious edge of 5% or more. Everything else is paper only.</li>' +
        '<li><b>Stake small and flat.</b> No more than 2% of your bankroll on one bet. Never raise the stake to win a loss back, and no accumulators to recover.</li>' +
        '<li><b>Stop at your daily limit.</b> Set it in My bets, and stop for the day when you reach it.</li>' +
        '<li><b>Let the numbers decide.</b> After 100 settled bets, if "Won" is below "Needed to break even", stop and fix the model, not the stake.</li></ol></section>';
    }
  }
  function togglePanel(name) {
    S.panel = S.panel === name ? null : name; S.delAll = false; renderPanel();
    if (S.panel && location.hash && location.hash !== '#matches') location.hash = '#matches'; else route();
    if (S.panel) window.scrollTo(0, 0);
  }

  /* ---------- routing ---------- */
  function route() {
    var mm = /^m-(\d+)$/.exec(location.hash.slice(1));
    var m = mm && S.data && S.data.matches[+mm[1]];
    if (m) { renderDetail(m); window.scrollTo(0, 0); }
    else renderList();
    if (!m) { var p = $('#panel'); p.hidden = false; }
    document.title = m ? m.home + ' v ' + m.away + ' · Football AI' : 'Football AI';
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-f],[data-card]'); if (!t) return;
    if (t.dataset.card) { S.scroll = window.scrollY; return; }
    if (t.dataset.f === 'betF') { S.betF = t.dataset.v; renderPanel(); return; }
    if (t.dataset.f) { S[t.dataset.f] = t.dataset.v; renderList(); return; }
    var a = t.dataset.act;
    if (a === 'data' || a === 'about' || a === 'bets') togglePanel(a);
    else if (a === 'logbtn') openLog(t.closest('.row'));
    else if (a === 'mode') { t.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); }); var lw = t.closest('.lf').querySelector('.lw'); lw.textContent = t.dataset.v === 'real' ? 'Real: you are placing this bet yourself on SportyBet. This only records it.' : 'Paper means no money: you only track whether the pick would have won.'; }
    else if (a === 'savebet') saveBet(t.closest('.row'));
    else if (a === 'settle') { S.bets.forEach(function (b) { if (b.id === t.dataset.id) b.st = t.dataset.v; }); saveBets(); renderPanel(); }
    else if (a === 'delbet') { S.bets = S.bets.filter(function (b) { return b.id !== t.dataset.id; }); saveBets(); renderPanel(); }
    else if (a === 'csv') { S.csv = !S.csv; renderPanel(); }
    else if (a === 'delall') { if (S.delAll) { S.bets = []; saveBets(); S.delAll = false; } else S.delAll = true; renderPanel(); }
    else if (a === 'paste') { var v = ($('#paste').value || '').trim(); if (!v) flash('Paste the file contents first.', true); else loadText(v, 'pasted on this phone'); }
    else if (a === 'url') {
      var u = ($('#url').value || '').trim(); if (!u) { flash('Enter the web address first.', true); return; }
      flash('Loading…');
      fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (txt) { lsSet('fai-url', u); loadText(txt, u); })
        .catch(function () { flash('Could not load that address. A preview page may block outside addresses. Your own site or the paste option will work.', true); });
    }
    else if (a === 'demo') { setData(demoRaw(), 'demo', true, false); lsDel('fai-data'); S.panel = null; renderPanel(); if (location.hash && location.hash !== '#matches') location.hash = '#matches'; else route(); }
    else if (a === 'forget') { lsDel('fai-data'); lsDel('fai-src'); lsDel('fai-odds'); flash('Saved predictions and odds removed from this phone. Your bets are kept.'); }
  });
  document.addEventListener('change', function (e) {
    var c = e.target.dataset && e.target.dataset.cfg;
    if (c) { S.cfg[c] = e.target.value.trim(); jset('fai-cfg', S.cfg); return; }   /* no re-draw: it would steal focus from the next field */
    if (e.target.id !== 'file' || !e.target.files || !e.target.files[0]) return;
    var f = e.target.files[0], r = new FileReader();
    r.onload = function () { loadText(String(r.result), f.name); };
    r.onerror = function () { flash('Could not read that file.', true); };
    r.readAsText(f);
  });
  document.addEventListener('input', function (e) { if (e.target.matches && e.target.matches('input.odds')) updateRow(e.target, true); });
  window.addEventListener('hashchange', route);

  /* ---------- start ---------- */
  function start() {
    var done = function () { renderPanel(); route(); };
    fetch('predictions.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (raw) { setData(raw, 'predictions.json on this site', false, false); })
      .catch(function () {
        var saved = lsGet('fai-data');
        try { if (saved) { setData(JSON.parse(saved), lsGet('fai-src') || 'saved on this phone', false, false); return; } } catch (e) {}
        setData(demoRaw(), 'demo', true, false);
      })
      .then(done);
  }
  start();
})();
</script>

</body>
