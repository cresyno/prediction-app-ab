<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football AI - Safe Bets</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent);
        }
        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 4px 0 0 0;
        }
        .match-card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .match-header {
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .league-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .teams {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .market-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }
        .market-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .market-name {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .market-prob {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: bold;
            margin-top: 4px;
        }
        .odds-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="number"] {
            width: 65px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            text-align: center;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        .value-badge {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            display: none; /* Hidden until odds are entered */
        }
        .value-badge.show {
            display: block;
        }
        .value-badge.good {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
        .value-badge.bad {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ Football AI</h1>
        <p id="update-time">Loading predictions...</p>
    </div>

    <div id="app">
        <div class="loading">Fetching matches...</div>
    </div>

    <script>
        // Fetch the JSON file generated by Pydroid
        fetch('predictions.json')
            .then(response => response.json())
            .then(data => {
                const app = document.getElementById('app');
                const timeEl = document.getElementById('update-time');
                app.innerHTML = ''; // Clear loading text
                
                // Show when the file was generated
                timeEl.innerText = `Updated: ${data.generated.replace('T', ' ')}`;

                if (data.matches.length === 0) {
                    app.innerHTML = '<div class="loading">No upcoming matches found.</div>';
                    return;
                }

                data.matches.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';

                    // Safely extract probabilities (fallback to 0 if missing)
                    const homeProb = match.markets[match.home + " goals"] ? match.markets[match.home + " goals"]["Over 0.5"] : 0;
                    const awayProb = match.markets[match.away + " goals"] ? match.markets[match.away + " goals"]["Over 0.5"] : 0;
                    const totalProb = match.markets["Total goals"] ? match.markets["Total goals"]["Over 1.5"] : 0;

                    // Only render if we have valid probabilities (ignores bad data)
                    if (homeProb === 0 || awayProb === 0) return;

                    card.innerHTML = `
                        <div class="match-header">
                            <div class="league-date">${match.league} &bull; ${match.date} ${match.time}</div>
                            <div class="teams">${match.home} vs ${match.away}</div>
                        </div>

                        <!-- Safe Market 1: Home Team Over 0.5 -->
                        <div class="market-row">
                            <div class="market-info">
                                <span class="market-name">${match.home} Over 0.5 Goals</span>
                                <span class="market-prob">Model Prob: ${(homeProb * 100).toFixed(1)}%</span>
                            </div>
                            <div class="odds-container">
                                <input type="number" step="0.01" placeholder="Odds" oninput="checkValue(this, ${homeProb})">
                                <span class="value-badge">-</span>
                            </div>
                        </div>

                        <!-- Safe Market 2: Away Team Over 0.5 -->
                        <div class="market-row">
                            <div class="market-info">
                                <span class="market-name">${match.away} Over 0.5 Goals</span>
                                <span class="market-prob">Model Prob: ${(awayProb * 100).toFixed(1)}%</span>
                            </div>
                            <div class="odds-container">
                                <input type="number" step="0.01" placeholder="Odds" oninput="checkValue(this, ${awayProb})">
                                <span class="value-badge">-</span>
                            </div>
                        </div>

                        <!-- Safe Market 3: Total Over 1.5 -->
                        <div class="market-row">
                            <div class="market-info">
                                <span class="market-name">Total Over 1.5 Goals</span>
                                <span class="market-prob">Model Prob: ${(totalProb * 100).toFixed(1)}%</span>
                            </div>
                            <div class="odds-container">
                                <input type="number" step="0.01" placeholder="Odds" oninput="checkValue(this, ${totalProb})">
                                <span class="value-badge">-</span>
                            </div>
                        </div>
                    `;
                    app.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById('app').innerHTML = '<div class="loading">⚠️ Error loading predictions.json.<br>Make sure the file is in the same folder.</div>';
                console.error(error);
            });

        // Function to calculate Value when you type odds
        function checkValue(inputElement, modelProb) {
            const odds = parseFloat(inputElement.value);
            const badge = inputElement.nextElementSibling; // The span element

            if (odds > 1.01) {
                const impliedProb = 1 / odds;
                
                // If our model probability is higher than the bookie's implied probability
                if (modelProb > impliedProb) {
                    const edge = ((modelProb - impliedProb) * 100).toFixed(1);
                    badge.innerText = `Value +${edge}%`;
                    badge.className = 'value-badge show good';
                } else {
                    badge.innerText = `No Value`;
                    badge.className = 'value-badge show bad';
                }
            } else {
                badge.className = 'value-badge'; // Hide if empty
            }
        }
    </script>
</body>
</html>
